<aside class="sidebar" [class.open]="open">
  <div class="brand">
    <div class="brand-mark">{{ companyInitial }}</div>
    <div class="brand-copy">
      <strong>{{ companyName }}</strong>
      <span>HR workspace</span>
    </div>
  </div>
  <p class="brand-note">Attendance, leave, payroll, and more — for your team.</p>
  <nav>
    <ng-container *ngFor="let item of navItems()">
      <!-- Flat nav item -->
      <a
        *ngIf="!isGroup(item)"
        [routerLink]="item.path"
        routerLinkActive="active"
        (click)="closed.emit()"
      >
        <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>

      <!-- Group with children -->
      <div *ngIf="isGroup(item)" class="nav-group">
        <button
          type="button"
          class="group-header"
          [class.expanded]="isGroupExpanded(item.key)"
          (click)="toggleGroup(item.key)"
        >
          <span class="group-arrow">›</span>
          <span class="nav-icon" aria-hidden="true">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </button>
        <div *ngIf="isGroupExpanded(item.key)" class="group-items">
          <a
            *ngFor="let child of item.children"
            [routerLink]="child.path"
            routerLinkActive="active"
            class="group-item"
            (click)="closed.emit()"
          >
            <span class="nav-icon nav-icon--child" aria-hidden="true">{{ child.icon }}</span>
            <span class="nav-label">{{ child.label }}</span>
          </a>
        </div>
      </div>
    </ng-container>
  </nav>
</aside>
