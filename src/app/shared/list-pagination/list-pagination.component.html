<div class="pagination" *ngIf="pagination.total > 0">
  <div class="page-summary">
    Showing {{ startItem }}-{{ endItem }} of {{ pagination.total }}
  </div>

  <div class="page-controls">
    <label>
      Rows
      <select
        [ngModel]="pagination.limit"
        (ngModelChange)="onLimitChange($event)"
        [disabled]="disabled">
        <option *ngFor="let option of pageSizeOptions" [ngValue]="option">{{ option }}</option>
      </select>
    </label>

    <button type="button" (click)="previous()" [disabled]="disabled || pagination.page <= 1">
      Previous
    </button>
    <span>Page {{ pagination.page }} of {{ pagination.totalPages }}</span>
    <button type="button" (click)="next()" [disabled]="disabled || pagination.page >= pagination.totalPages">
      Next
    </button>
  </div>
</div>
