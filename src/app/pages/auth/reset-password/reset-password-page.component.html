<div class="auth-shell">
  <div class="auth-card">
    <h1>Reset Password</h1>
    <p>Create a new password for your account.</p>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <label>New password</label>
      <input type="password" formControlName="password" placeholder="At least 8 characters" />

      <label>Confirm password</label>
      <input type="password" formControlName="confirmPassword" placeholder="Repeat password" />

      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Updating...' : 'Update password' }}
      </button>
    </form>

    <button type="button" class="secondary" (click)="goToLogin()">Back to login</button>
  </div>
</div>
