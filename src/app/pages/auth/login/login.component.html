<div class="auth-shell">
  <div class="auth-card">
    <h1>FlowHR</h1>
    <p>Sign in to your HRMS workspace</p>
    <form [formGroup]="form" (ngSubmit)="submit()">
      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
      <label>Company code</label>
      <input type="text" formControlName="companyCode" placeholder="tnt1" />
      <small>For SUPER_ADMIN you can leave this blank. Tenant users must provide stored company code.</small>
      <label>Email</label>
      <input type="email" formControlName="email" placeholder="admin@flowhr.com" />
      <label>Password</label>
      <input type="password" formControlName="password" placeholder="Enter password" />
      <button type="submit" [disabled]="form.invalid || loading">{{ loading ? 'Signing in...' : 'Sign in' }}</button>
    </form>

    <div class="auth-links">
      <a routerLink="/forgot-password">Forgot password?</a>
      <a routerLink="/accept-invitation">Accept invitation</a>
    </div>
  </div>
</div>
