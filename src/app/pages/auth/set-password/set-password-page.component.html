<div class="auth-shell">
  <div class="auth-card">
    <h1>Set Password</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <label>New password</label>
      <input type="password" formControlName="password" placeholder="At least 8 characters" />

      <label>Confirm password</label>
      <input type="password" formControlName="confirmPassword" placeholder="Repeat password" />

      <button type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Saving...' : 'Set Password' }}
      </button>
    </form>

    <button type="button" class="secondary" (click)="goToLogin()">Go to login</button>
    <a routerLink="/accept-invitation" [queryParams]="{ token }">Back to invitation</a>
  </div>
</div>
